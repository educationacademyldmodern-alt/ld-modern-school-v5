<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ERP Resource Viewer</title><link rel="stylesheet" href="udise-v306.css"><link rel="stylesheet" href="workspace-v323.css"><style>*{box-sizing:border-box}.r323ViewerBar{height:64px}body{margin:0;padding:20px;background:#eff6fb;color:#193e56;font-family:u306Text,system-ui,sans-serif}main{max-width:700px;margin:40px auto;padding:24px;background:white;border:1px solid #d4e4ed;border-radius:20px}button{font:inherit;min-height:44px;border:0;border-radius:10px;background:#155c77;color:white;padding:10px 16px}#r323Viewer{width:calc(100vw - 16px);height:calc(100dvh - 16px);max-width:none;max-height:none;margin:8px}#r323Viewer iframe{height:calc(100% - 64px);width:100%;border:0}#notice{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>HTML / ZIP टूल</h1><p id="notice" role="status">फाइल खोलने की तैयारी हो रही है…</p><button id="close">टूल टैब बंद करें</button></main><script>window.__LDM_RESOURCE_RUNNER=true;window.opener=null;window.render=async()=>{};window.toast=t=>document.getElementById('notice').textContent=t;</script><script src="resources-v330.js?v=330"></script><script>
(()=>{'use strict';const note=document.getElementById('notice');document.getElementById('close').onclick=()=>window.close();const nonce=location.hash.slice(1);if(!/^[a-f0-9-]{36}$/i.test(nonce)){note.textContent='ERP Link Manager में जाकर टूल फिर खोलें।';return}history.replaceState(null,'',location.pathname);const channel=new BroadcastChannel('ldm-tool-'+nonce);let accepted=false;const timeout=setTimeout(()=>{channel.close();if(!accepted)note.textContent='ERP से फाइल नहीं मिली। ERP Link Manager में जाकर दोबारा खोलें।'},30000);channel.onmessage=async e=>{const data=e.data;if(accepted)return;if(data?.type==='error'){clearTimeout(timeout);channel.close();note.textContent=data.message;return}if(data?.type!=='resource'||!data.row?.id||!['html','zip'].includes(data.row.kind)||typeof data.owner!=='string')return;let url;try{url=new URL(data.downloadURL);if(url.protocol!=='https:')return}catch(_){return}accepted=true;clearTimeout(timeout);channel.postMessage({type:'started'});channel.close();window.profile={id:data.owner,role:'admin',status:'active'};window.sb={storage:{from:()=>({download:async()=>{const response=await fetch(url.href,{credentials:'omit',cache:'no-store'});if(!response.ok)throw Error('फाइल डाउनलोड नहीं हुई; ERP से फिर खोलें।');return {data:await response.blob()}}})}};note.textContent='टूल इसी टैब में चल रहा है। मुख्य ERP अपने टैब में खुला है।';await window.LDM_RESOURCES.openResource(data.row)};channel.postMessage({type:'ready'});window.addEventListener('pagehide',()=>{channel.close();LDM_RESOURCES.dispose()});})();
</script></body></html>
