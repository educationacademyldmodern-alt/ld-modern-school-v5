<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07142b"><title>Sky Sir Teacher Remote</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100vh}.remote{width:min(560px,94vw);padding:22px;border-radius:26px}.remote-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.remote-grid button{min-height:82px;font-size:18px}.remote-code{font-size:30px;font-weight:900;letter-spacing:.08em}</style></head><body><div class="remote glass"><div class="eyebrow">SKY SIR CLASSES</div><h1>Teacher Remote</h1><p class="muted-line">Private phone controls. Cross-device mode uses the same Supabase account + 6-digit pairing code.</p><div id="loginBox"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn primary" id="login">Login</button></div><div id="pairBox"><input id="code" class="remote-code" inputmode="numeric" maxlength="6" placeholder="Pairing code"><button class="btn primary" id="pair">Pair Remote</button><p id="status" class="muted-line">Same-device commands work immediately. Cloud pairing requires config.js.</p></div><div class="module-card" id="privateNotes" hidden><h4>Private Teacher Notes</h4><pre id="notesText" style="white-space:pre-wrap;font:inherit;color:#dceaff"></pre></div><div class="remote-grid"><button class="btn ghost" data-cmd="prev">◀ Previous</button><button class="btn ghost" data-cmd="next">Next ▶</button><button class="btn ghost" data-cmd="reveal">💡 Reveal</button><button class="btn ghost" data-cmd="board">✏ Board</button><button class="btn ghost" data-cmd="notes">🎙 Notes</button><button class="btn ghost" data-cmd="timer">⏱ Timer</button><button class="btn primary" data-cmd="complete" style="grid-column:1/-1">✅ Complete Class</button></div></div><script src="config.js"></script><script src="db.js"></script><script>
const $=s=>document.querySelector(s);const bc=('BroadcastChannel'in window)?new BroadcastChannel('sky-sir-teaching-remote'):null;let paired='';async function authState(){if(!SKY_DB.configured()){$('#loginBox').style.display='none';return}const u=await SKY_DB.user();$('#loginBox').style.display=u?'none':'block';$('#status').textContent=u?'Cloud account ready. Enter pairing code.':'Login with the same Teaching Studio account.'}authState();$('#login').onclick=async()=>{try{await SKY_DB.login($('#email').value,$('#password').value);authState()}catch(e){$('#status').textContent=e.message}};$('#pair').onclick=async()=>{paired=$('#code').value.trim();if(paired.length!==6)return $('#status').textContent='Enter 6-digit code.';if(SKY_DB.configured()){try{const r=await SKY_DB.getRemoteSession(paired);if(!r)throw new Error('Pairing code not found');$('#status').textContent='Paired: '+(r.payload_json?.course||'Teaching Studio')+' Day '+(r.payload_json?.day||'');$('#notesText').textContent=r.payload_json?.notes||'No notes shared';$('#privateNotes').hidden=false}catch(e){return $('#status').textContent=e.message}}else $('#status').textContent='Local pairing ready.'};document.addEventListener('click',async e=>{const b=e.target.closest('[data-cmd]');if(!b)return;const command=b.dataset.cmd;if(command==='notes'){if(!$('#privateNotes').hidden){$('#privateNotes').scrollIntoView({behavior:'smooth'})}return}bc?.postMessage({command});if(paired&&SKY_DB.configured()){try{await SKY_DB.sendRemote(paired,command);$('#status').textContent='Sent: '+command}catch(err){$('#status').textContent=err.message}}else $('#status').textContent='Sent locally: '+command});</script></body></html>
