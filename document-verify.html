<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Document Verification</title><style>body{margin:0;background:#eef3f7;color:#183c58;font:16px/1.6 system-ui}main{max-width:560px;margin:8vh auto;padding:30px;background:white;border:1px solid #abc0d1;border-radius:16px}h1{font-size:23px}.badge{font-weight:bold;padding:12px;background:#eef4f8}dl{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}.ok{color:#176348}.bad{color:#a52727}</style></head><body><main><h1>L D MODERN EDUCATION ACADEMY</h1><h2>Document Verification</h2><p id="state" class="badge">दस्तावेज़ की स्थिति जाँची जा रही है…</p><dl id="details"></dl><p>Verification confirms the school register entry and its current status. This page does not publish student names, marks, photographs or guardian details.</p></main><script src="document-public-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const state=document.getElementById('state');try{const token=new URLSearchParams(location.search).get('token');if(!/^[0-9a-f]{64}$/.test(token||''))throw Error('अमान्य दस्तावेज़ लिंक / Invalid link');const config=window.LDM_DOCUMENT_PUBLIC_CONFIG;if(!config||!window.supabase)throw Error('Verification unavailable. Please retry with internet access.');const db=supabase.createClient(config.url,config.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),r=await db.rpc('ldm_v345_doc_verify',{p_token:token});if(r.error)throw Error('Verification unavailable. Contact the school.');if(!r.data?.ok)throw Error('Document not found in the school register.');const v=r.data;state.textContent=v.status==='active'?'✓ ACTIVE / वैध':v.status==='superseded'?'⚠ SUPERSEDED / नया संस्करण जारी है':'✕ REVOKED / रद्द';state.className='badge '+(v.status==='active'?'ok':'bad');for(const [label,value]of [['Document No.',v.document_no],['Type',v.kind],['Session',v.academic_session],['Exam',v.exam_name],['Issued',new Date(v.issued_at).toLocaleDateString('en-IN')]]){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;document.getElementById('details').append(dt,dd)}}catch(e){state.textContent=e.message;state.className='badge bad'}})();
</script></body></html>
