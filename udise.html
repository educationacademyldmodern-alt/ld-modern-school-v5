<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LDM UDISE+ Control Center</title><style>
:root{--bg:#eef4fb;--ink:#17324d;--muted:#6b7f94;--card:#fff;--line:#dce7f2;--blue:#1768df;--green:#0b8a68;--amber:#d97706;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#071b38;color:#fff;box-shadow:0 4px 18px #0b2a4b22}.top h1{font-size:17px;margin:0}.top small{display:block;color:#cfe3fb;margin-top:2px}.top .sp{flex:1}.btn{border:1px solid #cfdae7;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.green{background:var(--green);color:#fff;border-color:var(--green)}.btn.dark{background:#0b2748;color:#fff;border-color:#0b2748}.wrap{max-width:1280px;margin:auto;padding:16px}.hero{padding:18px;border-radius:20px;background:linear-gradient(135deg,#06356b,#1768df 58%,#0f8b6e);color:#fff;box-shadow:0 16px 30px #0c37651e}.hero h2{margin:3px 0 6px}.hero p{margin:0;color:#e8f4ff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid #d4e1ef;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.tabs button.active{background:#123f70;color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #0d2a500b}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.card b{display:block}.card small{color:var(--muted)}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.form label{display:grid;gap:4px;font-size:11px;font-weight:800;color:#405d79}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #cfdae6;border-radius:9px;background:#fff}.form textarea{min-height:90px}.full{grid-column:1/-1}.tableWrap{overflow:auto;border:1px solid #e2e9f1;border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid #e8eef5;text-align:left;font-size:12px}.table th{background:#f6f9fc;color:#52667c}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900;background:#eef4fb}.ok{background:#e8f8ef;color:#087447}.warn{background:#fff4db;color:#8a6100}.danger{background:#ffeded;color:#a32318}.muted{color:var(--muted);font-size:11px}.empty{padding:18px;color:var(--muted);border:1px dashed #cbd8e6;border-radius:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}.linkCard{display:flex;flex-direction:column;gap:5px;min-height:110px;border:0;border-radius:16px;padding:14px;text-align:left;color:#fff;cursor:pointer;box-shadow:0 9px 22px #0d2b4a22}.linkCard:nth-child(4n+1){background:linear-gradient(145deg,#1768df,#0b4ca8)}.linkCard:nth-child(4n+2){background:linear-gradient(145deg,#0ea373,#08745a)}.linkCard:nth-child(4n+3){background:linear-gradient(145deg,#7c3aed,#5b21b6)}.linkCard:nth-child(4n){background:linear-gradient(145deg,#f59e0b,#c46a05)}.linkCard i{font-size:25px}.linkCard small{color:#fff;opacity:.92}.toast{position:fixed;right:16px;bottom:16px;background:#102a43;color:#fff;padding:11px 14px;border-radius:9px;z-index:20}.modal{position:fixed;inset:0;background:#06152b99;display:grid;place-items:center;padding:15px;z-index:30}.modalBox{width:min(1000px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:16px}.a4{width:210mm;min-height:297mm;margin:auto;background:#fff;padding:14mm;color:#111;font-family:Arial,sans-serif}.a4 h1,.a4 h2{text-align:center}.a4 table{width:100%;border-collapse:collapse}.a4 th,.a4 td{border:1px solid #999;padding:6px;font-size:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:10px}.top{flex-wrap:wrap}.a4{zoom:.42}}@media print{body>*{display:none!important}#printRoot{display:block!important;position:absolute!important;inset:0!important}.a4{width:210mm!important;min-height:297mm!important;margin:0!important;zoom:1!important}@page{size:A4 portrait;margin:0}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="top"><button class="btn" onclick="backERP()">← ERP</button><div><h1>UDISE+ Control Center</h1><small>Lightweight • Official links • School-side readiness tracker</small></div><div class="sp"></div><button class="btn" onclick="location.reload()">↻ Refresh</button></header>
<main class="wrap"><section class="hero"><small>SILENT UNTIL OPENED</small><h2>UDISE+ School Readiness Workspace</h2><p>Password/CAPTCHA ERP में store या bypass नहीं होगा. Final entry official UDISE+ portal पर ही होगी.</p></section><div class="tabs" id="tabs"></div><div id="view"><div class="empty">Loading…</div></div></main><div id="printRoot"></div>
<script>
const DEFAULT_CFG={url:'https://xleagfmdueyalkdnicyr.supabase.co',key:'sb_publishable_tUcd7gPfNiTzZlZ44VM6UQ_zr045LR5'};
let cfg=DEFAULT_CFG;try{let x=JSON.parse(localStorage.getItem('ld_v5_cloud')||'null');if(x?.url&&x?.key)cfg=x}catch(e){}
let sb=null,session=null,profile=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
async function authBoot(){sb=supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let r=await sb.auth.getSession();session=r.data.session;if(!session)throw new Error('Login Required — पहले main ERP में login करें.');let p=await sb.from('profiles').select('id,full_name,role').eq('id',session.user.id).maybeSingle();if(p.error)throw p.error;profile=p.data||{};if(!['admin','super_admin','principal'].includes(String(profile.role||'').toLowerCase()))throw new Error('Permission Denied — Admin / Principal only.');return true}
function backERP(){location.href='./index.html'}

const SESSION=()=>new Date().getMonth()>=3?`${new Date().getFullYear()}-${String((new Date().getFullYear()+1)%100).padStart(2,'0')}`:`${new Date().getFullYear()-1}-${String(new Date().getFullYear()%100).padStart(2,'0')}`;
const DEFAULTS=[['School Profile','school_identity','School identity, management, address and recognition details'],['School Profile','school_contact','School contact, head details and location'],['Facilities','rooms','Classrooms / building / boundary / ramps'],['Facilities','water_toilet','Drinking water / toilets / handwash'],['Facilities','electricity_ict','Electricity / internet / ICT / smart classroom'],['Facilities','library_lab','Library / laboratory / sports facilities'],['Students','student_master','Class-section-wise student master verification'],['Students','apaar','APAAR / identity readiness and mismatch review'],['Students','enrolment','New admission / promotion / transfer status'],['Teachers','teacher_master','Teacher profile, qualification and service details'],['Teachers','teacher_assignment','Subject / class / designation verification'],['Attendance','attendance_readiness','Student and teacher attendance readiness'],['Reports','data_match','ERP vs UDISE+ totals verification'],['Reports','final_review','Final cross-check before official submission']];
const TABS=[['overview','Overview'],['checklist','Checklist'],['deadlines','Deadlines'],['links','Official Links'],['export','Export / Print']];let current='overview',rows=[];
function tabBar(){$('tabs').innerHTML=TABS.map(x=>`<button class="${current===x[0]?'active':''}" onclick="showTab('${x[0]}')">${x[1]}</button>`).join('')}
async function loadRows(){let r=await sb.from('ldm_udise_items').select('*').eq('academic_session',SESSION()).order('sort_order').limit(500);if(r.error)throw r.error;rows=r.data||[]}
function saved(key){return rows.find(x=>x.item_key===key)}
async function showTab(t){current=t;tabBar();if(t==='overview')renderOverview();if(t==='checklist')renderChecklist();if(t==='deadlines')renderDeadlines();if(t==='links')renderLinks();if(t==='export')renderExport()}
function renderOverview(){let done=DEFAULTS.filter(x=>saved(x[1])?.status==='Completed').length,pending=DEFAULTS.length-done;$('view').innerHTML=`<div class="grid"><div class="card"><small>Academic Session</small><b>${SESSION()}</b></div><div class="card"><small>Checklist Items</small><b>${DEFAULTS.length}</b></div><div class="card"><small>Completed</small><b>${done}</b></div><div class="card"><small>Pending</small><b>${pending}</b></div></div><section class="panel"><h3>Fast Actions</h3><div class="grid"><button class="linkCard" onclick="openLink('https://profile.udiseplus.gov.in/')"><i>🏫</i><b>Profile & Facilities</b><small>Official UDISE+ module</small></button><button class="linkCard" onclick="openLink('https://teacher.udiseplus.gov.in/')"><i>👨‍🏫</i><b>Teacher Module</b><small>Official UDISE+ module</small></button><button class="linkCard" onclick="openLink('https://www.udiseplus.gov.in/udisereport/')"><i>📊</i><b>Reports</b><small>Official reporting module</small></button><button class="linkCard" onclick="showTab('checklist')"><i>✅</i><b>Readiness Checklist</b><small>ERP-side preparation only</small></button></div></section>`}
function renderChecklist(){$('view').innerHTML=`<section class="panel"><div class="actions"><button class="btn primary" onclick="printChecklist()">Preview / Print</button><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="tableWrap"><table class="table"><tr><th>Category</th><th>Item</th><th>Status</th><th>Notes</th><th>Save</th></tr>${DEFAULTS.map((x,i)=>{let s=saved(x[1])||{};return `<tr><td>${esc(x[0])}</td><td><b>${esc(x[2])}</b></td><td><select id="st_${i}"><option ${s.status==='Pending'?'selected':''}>Pending</option><option ${s.status==='In Progress'?'selected':''}>In Progress</option><option ${s.status==='Completed'?'selected':''}>Completed</option><option ${s.status==='Not Applicable'?'selected':''}>Not Applicable</option></select></td><td><input id="nt_${i}" value="${esc(s.notes||'')}" placeholder="Short note"></td><td><button class="btn" onclick="saveItem(${i})">Save</button></td></tr>`}).join('')}</table></div></section>`}
async function saveItem(i){let x=DEFAULTS[i],old=saved(x[1]);let payload={academic_session:SESSION(),category:x[0],item_key:x[1],title:x[2],status:$('st_'+i).value,notes:$('nt_'+i).value,sort_order:i};let r=old?await sb.from('ldm_udise_items').update(payload).eq('id',old.id):await sb.from('ldm_udise_items').insert(payload);if(r.error)return toast(r.error.message);await loadRows();toast('Saved')}
function renderDeadlines(){$('view').innerHTML=`<section class="panel"><h3>Deadline / Notice Register</h3><div class="form"><label>Title<input id="dTitle"></label><label>Due Date<input id="dDate" type="date"></label><label>Status<select id="dStatus"><option>Pending</option><option>In Progress</option><option>Completed</option></select></label><label class="full">Notes<textarea id="dNote"></textarea></label></div><div class="actions"><button class="btn primary" onclick="saveDeadline()">Save Deadline</button></div></section><section class="panel"><div class="tableWrap"><table class="table"><tr><th>Title</th><th>Due</th><th>Status</th><th>Notes</th></tr>${rows.filter(x=>x.category==='Deadline').map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.due_date||'—')}</td><td>${esc(x.status)}</td><td>${esc(x.notes||'')}</td></tr>`).join('')||'<tr><td colspan="4">No deadlines saved.</td></tr>'}</table></div></section>`}
async function saveDeadline(){let title=$('dTitle').value.trim();if(!title)return toast('Title required');let key='deadline_'+Date.now();let r=await sb.from('ldm_udise_items').insert({academic_session:SESSION(),category:'Deadline',item_key:key,title,due_date:$('dDate').value||null,status:$('dStatus').value,notes:$('dNote').value||'',sort_order:1000});if(r.error)return toast(r.error.message);await loadRows();renderDeadlines();toast('Deadline saved')}
function renderLinks(){$('view').innerHTML=`<section class="panel"><h3>Official UDISE+ Links</h3><div class="grid"><button class="linkCard" onclick="openLink('https://www.udiseplus.gov.in/')"><i>🇮🇳</i><b>UDISE+ Home</b><small>Ministry of Education official portal</small></button><button class="linkCard" onclick="openLink('https://auth.udiseplus.gov.in/login')"><i>🔐</i><b>UDISE+ Sign In</b><small>Username / password / CAPTCHA on official site</small></button><button class="linkCard" onclick="openLink('https://profile.udiseplus.gov.in/')"><i>🏫</i><b>Profile & Facilities</b></button><button class="linkCard" onclick="openLink('https://teacher.udiseplus.gov.in/')"><i>👨‍🏫</i><b>Teacher Module</b></button><button class="linkCard" onclick="openLink('https://www.udiseplus.gov.in/udisereport/')"><i>📊</i><b>Reports Module</b></button></div></section>`}
function openLink(u){window.open(u,'_blank','noopener')}
function renderExport(){$('view').innerHTML=`<section class="panel"><h3>Low-load Export</h3><p class="muted">Generated files device पर बनते हैं; database में PDF store नहीं होता.</p><div class="actions"><button class="btn primary" onclick="exportCSV()">Download CSV</button><button class="btn" onclick="printChecklist()">Preview / Print / Save PDF</button></div></section>`}
function exportCSV(){let all=DEFAULTS.map(x=>{let s=saved(x[1])||{};return [x[0],x[2],s.status||'Pending',s.notes||'']});all.unshift(['Category','Item','Status','Notes']);let csv=all.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join(String.fromCharCode(10));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='UDISE-Readiness-'+SESSION()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function printChecklist(){let html=`<div class="a4"><h1>UDISE+ Readiness Checklist</h1><h2>${SESSION()}</h2><table><tr><th>Category</th><th>Item</th><th>Status</th><th>Notes</th></tr>${DEFAULTS.map(x=>{let s=saved(x[1])||{};return `<tr><td>${esc(x[0])}</td><td>${esc(x[2])}</td><td>${esc(s.status||'Pending')}</td><td>${esc(s.notes||'')}</td></tr>`}).join('')}</table></div>`;$('printRoot').innerHTML=html;window.print()}
(async()=>{try{await authBoot();await loadRows();tabBar();renderOverview()}catch(e){$('view').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`}})();
</script></body></html>
